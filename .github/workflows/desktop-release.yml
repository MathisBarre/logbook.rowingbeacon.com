name: Build and publish Rowing Beacon desktop

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  linux:
    name: Build signed Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            squashfs-tools libfuse2 file gnupg python3-pip
          pip install appimage-builder

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Import Linux AppImage signing key
        id: linux-signing
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_GPG_PRIVATE_KEY_PASSWORD: ${{ secrets.LINUX_GPG_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$LINUX_GPG_PRIVATE_KEY_BASE64" ]]; then
            echo "Missing GitHub secret LINUX_GPG_PRIVATE_KEY_BASE64" >&2
            exit 1
          fi
          if [[ -z "$LINUX_GPG_PRIVATE_KEY_PASSWORD" ]]; then
            echo "Missing GitHub secret LINUX_GPG_PRIVATE_KEY_PASSWORD" >&2
            exit 1
          fi

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$LINUX_GPG_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
          gpg --batch --import "$key_file"

          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ -z "$fingerprint" ]]; then
            echo "The imported GPG key does not contain a private key" >&2
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Build signed AppImage
        env:
          SIGN: "1"
          SIGN_KEY: ${{ steps.linux-signing.outputs.fingerprint }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.LINUX_GPG_PRIVATE_KEY_PASSWORD }}
          APPIMAGETOOL_FORCE_SIGN: "1"
        run: pnpm tauri build

      - name: Verify AppImage contains an embedded signature
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if (( ${#appimages[@]} == 0 )); then
            echo "No AppImage was produced" >&2
            exit 1
          fi
          for appimage in "${appimages[@]}"; do
            chmod +x "$appimage"
            "$appimage" --appimage-signature | grep -q -- "-----BEGIN PGP SIGNATURE-----"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Build Windows installers
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish public GitHub Release
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Add stable download names and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          appimages=(release-assets/*.AppImage)
          setup_exes=(release-assets/*-setup.exe)
          msis=(release-assets/*.msi)

          (( ${#appimages[@]} > 0 )) || { echo "Missing AppImage" >&2; exit 1; }
          (( ${#setup_exes[@]} > 0 )) || { echo "Missing Windows setup executable" >&2; exit 1; }

          cp "${appimages[0]}" release-assets/Rowing-Beacon-Linux-x86_64.AppImage
          cp "${setup_exes[0]}" release-assets/Rowing-Beacon-Windows-x64-setup.exe
          if (( ${#msis[@]} > 0 )); then
            cp "${msis[0]}" release-assets/Rowing-Beacon-Windows-x64.msi
          fi

          cd release-assets
          sha256sum -- * > SHA256SUMS.txt

      - name: Create or update the public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Rowing Beacon $tag" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
